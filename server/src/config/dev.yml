# 开发环境配置
app:
  prefix: ''
  port: 8181
  logger:
    # 项目日志存储路径，相对路径（相对本项目根目录）或绝对路径
    dir: '../logs'
  # 文件相关
  file:
    # 是否为本地文件服务或cos
    isLocal: true
    # location 文件上传后存储目录，相对路径（相对本项目根目录）或绝对路径
    location: '../upload'
    # 文件服务器地址，这是开发环境的配置 生产环境请自行配置成可访问域名
    domain: 'http://localhost:8181'
    # 文件虚拟路径, 必须以 / 开头， 如 http://localhost:8081/static/****.jpg  , 如果不需要则 设置 ''
    serveRoot: '/upload'
    # 文件大小限制，单位M
    maxSize: 10
# 腾讯云cos配置
cos:
  secretId: ''
  secretKey: ''
  bucket: ''
  region: ''
  domain: ''
  location: ''
# 数据库配置
db:
  postgres:
    # host: '192.168.0.30'
    # username: 'nest'
    # password: 'nest'
    # database: 'nest'
    host: '192.168.0.40'
    username: 'odoo'
    password: 'odoo'
    database: 'nest'
    port: 5432
    ssldisable: false
    # charset: 'utf8mb4'
    logger: 'file'
