    ssldisable: false
    # charset: 'utf8mb4'
    logger: 'file'
    logging: true
    multipleStatements: true
    dropSchema: false
    synchronize: false
    supportBigNumbers: true
    bigNumberStrings: true

# redis 配置
redis:
  host: 'localhost'
  password: ''
  port: 6379
  db: 2
  keyPrefix: ''

# jwt 配置
jwt:
  secretkey: 'you_secretkey'
  expiresin: '1h'
  refreshExpiresIn: '2h'
# 权限 白名单配置 注意post等方法与路由一致
perm:
  router:
    whitelist:
      [
        { path: '/captchaImage', method: 'GET' },
        { path: '/moreinfo', method: 'GET'},
        { path: '/auth/totp/verify', method: 'POST'},
        { path: '/register', method: 'POST' },
        { path: '/smscode', method: 'POST' },
        { path: '/login', method: 'POST' },
        { path: '/logout', method: 'POST' },
        { path: '/perm/{id}', method: 'GET' },
        { path: '/upload', method: 'POST' },
        # { path: '/emrManage/dynamicOptions/deptOptionlist', method: 'GET'},
        { path: '/emrManage/deepseek/testDSAPI', method: 'POST'}
      ]

# 用户相关
# 初始密码， 重置密码
user:
  initialPassword: '123456'
